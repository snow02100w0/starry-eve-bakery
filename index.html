<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星夕烘焙屋 · Starry Eve Bakery</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#0b1035;
  --sky-mid:#3a2358;
  --sky-warm:#c5643d;
  --sky-glow:#f2b061;
  --sea:#1a1c3a;
  --gold:#f4d29a;
  --gold-2:#c9994d;
  --ink:#f6ecd6;
  --ink-soft:#d9c9a3;
  --panel:rgba(14,16,45,.55);
  --panel-b:rgba(244,210,154,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:"Noto Serif TC","Cinzel",serif;color:var(--ink);background:#000}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit}

/* === 背景：夕陽 + 星空 + 海平線 === */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#050826 0%,#1a1746 25%,#4b2a5e 48%,#a35146 60%,#e6a45c 66%,#f4c98a 68%,#1a1c3a 70%,#0a0d2a 100%)}
.stars,.stars2,.stars3,.bigstars{position:absolute;left:0;right:0;top:0;height:70%;background-repeat:repeat;pointer-events:none}
.stars{background-image:
  radial-gradient(1px 1px at 12px 22px,#fff,transparent),
  radial-gradient(1px 1px at 48px 88px,#fff,transparent),
  radial-gradient(1.4px 1.4px at 92px 40px,#fff,transparent),
  radial-gradient(1px 1px at 140px 130px,#fff,transparent),
  radial-gradient(1.2px 1.2px at 180px 66px,#fff8dc,transparent),
  radial-gradient(1px 1px at 220px 12px,#fff,transparent),
  radial-gradient(1.6px 1.6px at 260px 180px,#fff,transparent),
  radial-gradient(1px 1px at 300px 100px,#fff,transparent),
  radial-gradient(1px 1px at 340px 44px,#ffe9b8,transparent),
  radial-gradient(1.3px 1.3px at 30px 160px,#fff,transparent),
  radial-gradient(1px 1px at 70px 210px,#fff,transparent),
  radial-gradient(1px 1px at 118px 8px,#fff,transparent),
  radial-gradient(1.5px 1.5px at 200px 200px,#fff,transparent),
  radial-gradient(1px 1px at 250px 60px,#fff,transparent),
  radial-gradient(1px 1px at 290px 240px,#fff,transparent),
  radial-gradient(1.2px 1.2px at 360px 220px,#fff8dc,transparent);
  background-size:380px 260px;animation:twinkle 4s ease-in-out infinite alternate;opacity:.95}
.stars2{background-image:
  radial-gradient(1px 1px at 22px 40px,#fff,transparent),
  radial-gradient(1.4px 1.4px at 60px 130px,#ffe9b8,transparent),
  radial-gradient(1px 1px at 110px 20px,#fff,transparent),
  radial-gradient(1px 1px at 150px 200px,#fff,transparent),
  radial-gradient(1.5px 1.5px at 210px 80px,#fff,transparent),
  radial-gradient(1px 1px at 250px 160px,#fff,transparent),
  radial-gradient(1.2px 1.2px at 300px 30px,#fff,transparent),
  radial-gradient(1px 1px at 340px 240px,#fff8dc,transparent),
  radial-gradient(1px 1px at 80px 260px,#fff,transparent),
  radial-gradient(1.3px 1.3px at 180px 300px,#fff,transparent),
  radial-gradient(1px 1px at 260px 280px,#fff,transparent);
  background-size:420px 340px;animation:twinkle 6s ease-in-out infinite alternate-reverse;opacity:.7}
.stars3{background-image:
  radial-gradient(0.8px 0.8px at 15px 55px,#fff,transparent),
  radial-gradient(0.8px 0.8px at 55px 15px,#fff,transparent),
  radial-gradient(0.8px 0.8px at 95px 95px,#fff,transparent),
  radial-gradient(0.8px 0.8px at 135px 35px,#fff,transparent),
  radial-gradient(0.8px 0.8px at 175px 145px,#fff,transparent),
  radial-gradient(0.8px 0.8px at 215px 65px,#fff,transparent),
  radial-gradient(0.8px 0.8px at 25px 175px,#fff,transparent),
  radial-gradient(0.8px 0.8px at 75px 125px,#fff,transparent),
  radial-gradient(0.8px 0.8px at 125px 205px,#fff,transparent),
  radial-gradient(0.8px 0.8px at 185px 25px,#fff,transparent),
  radial-gradient(0.8px 0.8px at 235px 195px,#fff,transparent);
  background-size:260px 230px;animation:twinkle 8s ease-in-out infinite alternate;opacity:.55}
.bigstars{background-image:
  radial-gradient(2px 2px at 120px 60px,#fff,rgba(255,255,255,0) 60%),
  radial-gradient(2.4px 2.4px at 380px 110px,#fff6d5,rgba(255,255,255,0) 60%),
  radial-gradient(2px 2px at 620px 40px,#fff,rgba(255,255,255,0) 60%),
  radial-gradient(2.6px 2.6px at 240px 180px,#ffe9b8,rgba(255,255,255,0) 60%),
  radial-gradient(2px 2px at 500px 220px,#fff,rgba(255,255,255,0) 60%),
  radial-gradient(2.2px 2.2px at 720px 160px,#fff,rgba(255,255,255,0) 60%),
  radial-gradient(2px 2px at 60px 260px,#fff6d5,rgba(255,255,255,0) 60%);
  background-size:820px 320px;animation:twinkle 3.5s ease-in-out infinite alternate;opacity:1;filter:drop-shadow(0 0 3px rgba(255,240,200,.9))}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
/* 銀河霧氣 */
.milky{position:absolute;left:-10%;right:-10%;top:5%;height:50%;background:
  radial-gradient(ellipse 60% 30% at 30% 40%,rgba(180,180,255,.12),transparent 70%),
  radial-gradient(ellipse 50% 20% at 70% 25%,rgba(220,180,255,.10),transparent 70%),
  radial-gradient(ellipse 40% 15% at 55% 55%,rgba(255,220,180,.08),transparent 70%);
  transform:rotate(-8deg);filter:blur(2px);pointer-events:none;mix-blend-mode:screen}
/* 流星 */
.shooting{position:absolute;top:0;left:0;width:100%;height:60%;pointer-events:none;overflow:hidden}
.shooting span{position:absolute;width:120px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0));filter:drop-shadow(0 0 6px #fff);transform:rotate(-25deg);opacity:0;animation:shoot 7s linear infinite}
.shooting span:nth-child(1){top:12%;left:-20%;animation-delay:1s}
.shooting span:nth-child(2){top:24%;left:-20%;animation-delay:3.5s;animation-duration:9s}
.shooting span:nth-child(3){top:8%;left:-20%;animation-delay:6s;animation-duration:6s;width:160px}
.shooting span:nth-child(4){top:30%;left:-20%;animation-delay:8.5s;animation-duration:8s}
@keyframes shoot{
  0%{transform:translate(0,0) rotate(-25deg);opacity:0}
  5%{opacity:1}
  40%{opacity:1}
  60%{transform:translate(90vw,45vh) rotate(-25deg);opacity:0}
  100%{transform:translate(90vw,45vh) rotate(-25deg);opacity:0}
}
.sun{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:min(46vh,320px);height:min(46vh,320px);border-radius:50%;background:radial-gradient(circle,#fff6d5 0%,#f7c266 40%,#e08a3a 65%,rgba(224,138,58,0) 72%);filter:blur(.5px);box-shadow:0 0 120px 40px rgba(247,180,90,.35)}
.sea{position:absolute;left:0;right:0;top:70%;bottom:0;background:linear-gradient(180deg,#1a1c3a 0%,#0a0d2a 100%);overflow:hidden}
.sea::before,.sea::after{content:"";position:absolute;left:-10%;right:-10%;height:2px;background:linear-gradient(90deg,transparent,rgba(247,200,120,.7),transparent);top:6%;filter:blur(.5px);animation:wave 6s ease-in-out infinite}
.sea::after{top:14%;animation-delay:-3s;opacity:.5}
@keyframes wave{50%{transform:translateX(20px)}}
.reflect{position:absolute;left:50%;top:70%;transform:translateX(-50%);width:min(46vh,320px);height:22vh;background:radial-gradient(ellipse at center top,rgba(247,180,90,.55),rgba(247,180,90,0) 70%);filter:blur(2px);mix-blend-mode:screen;pointer-events:none}
.horizon{position:absolute;left:0;right:0;top:70%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,220,160,.6),transparent);box-shadow:0 0 12px rgba(255,220,160,.5)}
.cloud{position:absolute;height:24px;background:rgba(20,10,40,.55);border-radius:50%;filter:blur(6px)}
.c1{width:220px;top:52%;left:8%}
.c2{width:180px;top:58%;right:10%}
.c3{width:260px;top:62%;left:35%}

/* === 主容器 === */
.app{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;padding:24px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:baseline;gap:14px}
.brand .logo{font-family:"Cinzel",serif;font-size:14px;letter-spacing:6px;color:var(--gold);opacity:.85}
.brand h1{font-size:28px;font-weight:600;letter-spacing:8px;text-shadow:0 0 24px rgba(247,200,120,.35)}
.brand small{font-family:"Cinzel",serif;color:var(--ink-soft);letter-spacing:3px;opacity:.7}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{padding:10px 18px;border:1px solid transparent;border-radius:999px;color:var(--ink-soft);letter-spacing:3px;transition:.3s;font-size:14px}
nav button:hover{color:var(--gold);border-color:var(--panel-b)}
nav button.active{color:#1a1030;background:linear-gradient(135deg,var(--gold),var(--gold-2));border-color:var(--gold);box-shadow:0 0 20px rgba(247,200,120,.4)}
.admin-btn{padding:8px 14px;border:1px solid var(--panel-b);border-radius:999px;color:var(--gold);font-size:12px;letter-spacing:2px}
.admin-btn:hover{background:rgba(244,210,154,.1)}
.admin-btn.on{background:rgba(244,210,154,.15);border-color:var(--gold)}

/* === 頁面切換 === */
main{flex:1;position:relative;margin-top:20px;min-height:0}
.page{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateY(20px) scale(.98);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.3,1);display:flex;flex-direction:column;min-height:0}
.page.active{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.panel{background:var(--panel);border:1px solid var(--panel-b);border-radius:18px;backdrop-filter:blur(14px);padding:28px 32px;box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);flex:1;display:flex;flex-direction:column;min-height:0}
.panel h2{font-size:22px;letter-spacing:6px;color:var(--gold);border-bottom:1px dashed var(--panel-b);padding-bottom:12px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.panel h2 .en{font-family:"Cinzel",serif;font-size:12px;letter-spacing:4px;color:var(--ink-soft);opacity:.6}
.scroll-area{flex:1;overflow-y:auto;padding-right:8px}
.scroll-area::-webkit-scrollbar{width:6px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--gold-2);border-radius:3px}

/* Home */
.hero{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;gap:18px}
.hero .tag{font-family:"Cinzel",serif;letter-spacing:8px;color:var(--gold);opacity:.8}
.hero .title{font-size:min(6vh,54px);letter-spacing:14px;line-height:1.4;text-shadow:0 0 30px rgba(247,200,120,.4)}
.hero .desc{max-width:640px;line-height:2;color:var(--ink-soft);letter-spacing:2px}
.announce-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:20px;width:100%}
.announce{background:rgba(10,12,40,.5);border:1px solid var(--panel-b);border-radius:12px;padding:16px;text-align:left;position:relative}
.announce .date{font-family:"Cinzel",serif;font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:6px}
.announce .t{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px;letter-spacing:2px}
.announce .b{font-size:13px;line-height:1.8;color:var(--ink-soft)}

/* Menu */
.cat-tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.cat-tabs button{padding:6px 16px;border:1px solid var(--panel-b);border-radius:999px;font-size:12px;letter-spacing:3px;color:var(--ink-soft)}
.cat-tabs button.on{background:var(--gold);color:#1a1030;border-color:var(--gold)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.menu-item{background:rgba(10,12,40,.55);border:1px solid var(--panel-b);border-radius:12px;padding:16px;position:relative;transition:.3s}
.menu-item:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.menu-item .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.menu-item .name{font-size:17px;font-weight:600;color:var(--gold);letter-spacing:2px}
.menu-item .price{font-family:"Cinzel",serif;color:var(--ink);font-size:15px;white-space:nowrap}
.menu-item .price::before{content:"❈ "}
.menu-item .desc{font-size:13px;line-height:1.8;color:var(--ink-soft)}
.menu-item .en{font-family:"Cinzel",serif;font-size:11px;letter-spacing:2px;color:var(--ink-soft);opacity:.55;margin-top:4px}

/* Staff */
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.staff-card{background:rgba(10,12,40,.55);border:1px solid var(--panel-b);border-radius:14px;overflow:hidden;position:relative;transition:.3s;display:flex;flex-direction:column}
.staff-card:hover{border-color:var(--gold);box-shadow:0 8px 30px rgba(247,200,120,.15);transform:translateY(-2px)}
.staff-card .photo{width:100%;aspect-ratio:1/1;background:linear-gradient(135deg,#2a1f52,#0f1030);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.staff-card .photo img{width:100%;height:100%;object-fit:cover;display:block}
.staff-card .photo .fallback{font-family:"Cinzel",serif;font-size:64px;color:var(--gold);font-weight:700;text-shadow:0 0 24px rgba(247,200,120,.6);letter-spacing:0}
.staff-card .photo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg,transparent,rgba(10,12,40,.85));pointer-events:none}
.staff-card .info{padding:16px 18px 20px;text-align:center}
.staff-card .n{font-size:18px;letter-spacing:3px;color:var(--gold);margin-bottom:4px}
.staff-card .r{font-family:"Cinzel",serif;font-size:12px;letter-spacing:3px;color:var(--ink-soft);margin-bottom:10px;opacity:.7}
.staff-card .b{font-size:12px;line-height:1.8;color:var(--ink-soft);text-align:left}

/* Contact */
.contact-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:100%}
.contact-block{background:rgba(10,12,40,.5);border:1px solid var(--panel-b);border-radius:12px;padding:22px;position:relative}
.contact-block h3{font-size:15px;letter-spacing:4px;color:var(--gold);margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed var(--panel-b)}
.contact-block p{font-size:13px;line-height:2.1;color:var(--ink-soft);letter-spacing:1px}
.contact-block .kv{display:grid;grid-template-columns:80px 1fr;gap:6px 12px;font-size:13px;line-height:2}
.contact-block .kv b{color:var(--gold);font-weight:400;letter-spacing:2px}

/* Modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal-mask.on{display:flex}
.modal{background:linear-gradient(180deg,#151538,#0a0c28);border:1px solid var(--panel-b);border-radius:16px;padding:28px;width:min(520px,92vw);max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{color:var(--gold);letter-spacing:4px;margin-bottom:18px;font-size:18px;text-align:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink-soft);letter-spacing:2px;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;background:rgba(0,0,0,.4);border:1px solid var(--panel-b);border-radius:8px;color:var(--ink);font-size:14px;outline:none;transition:.2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}
.field textarea{resize:vertical;min-height:70px;font-family:inherit}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn{padding:9px 20px;border-radius:8px;font-size:13px;letter-spacing:3px;transition:.2s;border:1px solid var(--panel-b);color:var(--ink-soft)}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#1a1030;border-color:var(--gold);font-weight:600}
.btn.primary:hover{filter:brightness(1.1);color:#1a1030}
.btn.danger{color:#ff9a9a;border-color:#663}
.btn.danger:hover{color:#ffb0b0;border-color:#a44}

/* Admin controls on cards */
.admin-controls{position:absolute;top:8px;right:8px;display:none;gap:4px;z-index:10}
body.admin .admin-controls{display:flex}
.icon-btn{width:26px;height:26px;border-radius:6px;background:rgba(0,0,0,.5);border:1px solid var(--panel-b);color:var(--ink-soft);font-size:12px;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{color:var(--gold);border-color:var(--gold)}
.add-card{border:2px dashed var(--panel-b);border-radius:12px;padding:20px;text-align:center;color:var(--ink-soft);font-size:14px;letter-spacing:3px;cursor:pointer;transition:.2s;display:none;align-items:center;justify-content:center;min-height:100px}
.add-card:hover{border-color:var(--gold);color:var(--gold)}
body.admin .add-card{display:flex}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(20,20,50,.95);border:1px solid var(--gold);color:var(--gold);padding:12px 24px;border-radius:999px;z-index:200;letter-spacing:3px;font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;top:30px}

@media (max-width:720px){
  .app{padding:16px}
  .brand h1{font-size:20px;letter-spacing:5px}
  .brand .logo{display:none}
  nav button{padding:8px 12px;letter-spacing:2px;font-size:12px}
  .panel{padding:18px}
  .contact-wrap{grid-template-columns:1fr}
  .hero .title{font-size:26px;letter-spacing:6px}
}
</style>
</head>
<body>

<!-- 背景 -->
<div class="scene" aria-hidden="true">
  <div class="milky"></div>
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>
  <div class="bigstars"></div>
  <div class="shooting"><span></span><span></span><span></span><span></span></div>
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="horizon"></div>
  <div class="sea"></div>
  <div class="reflect"></div>
</div>

<div class="app">
  <header>
    <div class="brand">
      <span class="logo">✦ STARRY EVE ✦</span>
      <div>
        <h1>星夕烘焙屋</h1>
        <small>Starry Eve Bakery · Since Eorzea</small>
      </div>
    </div>
    <nav id="nav">
      <button data-page="home" class="active">首頁</button>
      <button data-page="menu">菜單</button>
      <button data-page="staff">員工</button>
      <button data-page="contact">聯絡</button>
      <button id="adminBtn" class="admin-btn">🔒 管理員</button>
    </nav>
  </header>

  <main id="main">
    <!-- 首頁 -->
    <section class="page active" id="page-home">
      <div class="panel">
        <h2>店主寄語 <span class="en">WELCOME</span></h2>
        <div class="scroll-area">
          <div class="hero">
            <div class="tag">◆ ANNOUNCEMENT ◆</div>
            <div class="title" id="homeTitle">日落之時，繁星初現</div>
            <div class="desc" id="homeDesc">歡迎光臨星夕烘焙屋。<br>在薰衣草苗圃的海平線邊，我們以最新鮮的麥粉與蜂蜜，烤出承載黃昏與星辰的甜點。<br>願旅人在此稍作歇息，飲一口暖茶，尋一片寧靜。</div>
            <div class="announce-grid" id="announceGrid"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 菜單 -->
    <section class="page" id="page-menu">
      <div class="panel">
        <h2>菜單 <span class="en">MENU</span></h2>
        <div class="cat-tabs" id="catTabs"></div>
        <div class="scroll-area">
          <div class="menu-grid" id="menuGrid"></div>
        </div>
      </div>
    </section>

    <!-- 員工 -->
    <section class="page" id="page-staff">
      <div class="panel">
        <h2>員工介紹 <span class="en">OUR STAFF</span></h2>
        <div class="scroll-area">
          <div class="staff-grid" id="staffGrid"></div>
        </div>
      </div>
    </section>

    <!-- 聯絡 -->
    <section class="page" id="page-contact">
      <div class="panel">
        <h2>聯絡與預約 <span class="en">CONTACT</span></h2>
        <div class="scroll-area">
          <div class="contact-wrap" id="contactWrap"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 登入 Modal -->
<div class="modal-mask" id="loginModal">
  <div class="modal">
    <h3>管理員登入</h3>
    <div class="field">
      <label>密碼</label>
      <input type="password" id="pwdInput" placeholder="請輸入管理員密碼">
    </div>
    <div class="btn-row">
      <button class="btn" onclick="closeModal('loginModal')">取消</button>

/* ============ 資料持久化 ============ */
const STORE_KEY = "starfall_bakery_v1";
let D = loadData();

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData(){
  localStorage.setItem(STORE_KEY, JSON.stringify(D));
}

/* ============ SHA-256 ============ */
async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* ============ 初始化預設密碼 ============ */
(async ()=>{
  if(!D.pwdHash){
    D.pwdHash = await sha256("starfall");
    saveData();
  }
})();

document.querySelectorAll("#nav button[data-page]").forEach(btn=>{

    document.querySelectorAll("#nav button[data-page]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("page-"+btn.dataset.page).classList.add("active");
  };
});

/* ============ 渲染 ============ */

  document.getElementById("homeDesc").innerHTML = D.home.desc;
  const ag = document.getElementById("announceGrid");

    <div class="announce">
      <div class="admin-controls">
        <button class="icon-btn" onclick="editItem('announcement',${i})">✎</button>
      </div>
      <div class="date">${escapeHtml(a.date)}</div>
      <div class="t">${escapeHtml(a.title)}</div>
      <div class="b">${escapeHtml(a.body||"")}</div>
    </div>
  `).join("") + `<div class="add-card" onclick="editItem('announcement',-1)">＋ 新增公告</div>`;

  // Menu
  const ct = document.getElementById("catTabs");
  const cats = ["全部",...D.categories];
  if(!window._curCat) window._curCat = "全部";
  ct.innerHTML = cats.map(c=>`<button class="${c===window._curCat?'on':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${escapeHtml(c)}</button>`).join("")
    + `<button style="opacity:.6" class="admin-only-btn" onclick="editItem('categories',-1)" ${document.body.classList.contains("admin")?"":"hidden"}>⚙ 分類</button>`;
  const mg = document.getElementById("menuGrid");
  const items = D.menu.filter(m=>window._curCat==="全部"||m.cat===window._curCat);
  mg.innerHTML = items.map(m=>{
    const idx = D.menu.indexOf(m);
    return `<div class="menu-item">
      <div class="admin-controls">
        <button class="icon-btn" onclick="editItem('menu',${idx})">✎</button>
      </div>
      <div class="row"><div class="name">${escapeHtml(m.name)}</div><div class="price">${escapeHtml(m.price)}</div></div>
      <div class="desc">${escapeHtml(m.desc)}</div>
      <div class="en">${escapeHtml(m.en||"")} · ${escapeHtml(m.cat)}</div>
    </div>`;
  }).join("") + `<div class="add-card" onclick="editItem('menu',-1)">＋ 新增菜色</div>`;

  // Staff
  const sg = document.getElementById("staffGrid");
  sg.innerHTML = D.staff.map((s,i)=>`
    <div class="staff-card">
      <div class="admin-controls">
        <button class="icon-btn" onclick="editItem('staff',${i})">✎</button>
      </div>
      <div class="photo">
        ${s.photo ? `<img src="${escapeHtml(s.photo)}" alt="${escapeHtml(s.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
        <div class="fallback" style="${s.photo?'display:none':''}">${escapeHtml(s.initial||s.name[0]||"?")}</div>
      </div>
      <div class="info">
        <div class="n">${escapeHtml(s.name)}</div>
        <div class="r">${escapeHtml(s.role)}</div>
        <div class="b">${escapeHtml(s.bio)}</div>

function setCat(c){ window._curCat = c; render(); }

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

/* ============ 編輯 ============ */
let editState = null;
function editItem(type,idx){
  if(!document.body.classList.contains("admin")){ toast("需要管理員登入"); return; }
  editState = {type, idx};
  const fields = document.getElementById("editFields");
  const title = document.getElementById("editTitle");
  document.getElementById("deleteBtn").style.display = idx>=0 ? "" : "none";

  let html="";
  if(type==="announcement"){
    title.textContent = idx>=0 ? "編輯公告" : "新增公告";
    const it = idx>=0 ? D.announcements[idx] : {date:"",title:"",body:""};
    html = f("日期","date",it.date,"input") + f("標題","title",it.title,"input") + f("內容","body",it.body,"textarea");
  } else if(type==="menu"){
    title.textContent = idx>=0 ? "編輯菜色" : "新增菜色";
    const it = idx>=0 ? D.menu[idx] : {cat:D.categories[0]||"",name:"",en:"",price:"",desc:""};
    html = fSelect("分類","cat",it.cat,D.categories) + f("名稱","name",it.name,"input") + f("英文名","en",it.en,"input") + f("價格","price",it.price,"input") + f("描述","desc",it.desc,"textarea");
  } else if(type==="staff"){
    title.textContent = idx>=0 ? "編輯員工" : "新增員工";
    const it = idx>=0 ? D.staff[idx] : {name:"",role:"",initial:"",bio:"",photo:""};
    html = f("姓名","name",it.name,"input")
         + f("職位","role",it.role,"input")
         + f("照片網址（貼 Imgur / Discord / 推特圖床連結，留空則顯示字母）","photo",it.photo||"","input")
         + f("字母（照片載入失敗時的備用顯示）","initial",it.initial,"input")
         + f("介紹","bio",it.bio,"textarea");
  } else if(type==="contact"){
    title.textContent = idx>=0 ? "編輯區塊" : "新增區塊";
    const it = idx>=0 ? D.contact[idx] : {title:"",lines:{}};
    const linesText = Object.entries(it.lines).map(([k,v])=>`${k}: ${v}`).join("\n");
    html = f("區塊標題","title",it.title,"input") + f("內容（每行一組「鍵: 值」，例：週一: 20:00 – 02:00）","lines",linesText,"textarea-lg");
  } else if(type==="categories"){
    title.textContent = "管理分類";
    document.getElementById("deleteBtn").style.display = "none";
    html = f("分類（每行一個）","cats",D.categories.join("\n"),"textarea");
  }
  fields.innerHTML = html;
  openModal("editModal");
}

function f(label,key,val,tag){
  let el;
  if(tag==="textarea") el = `<textarea data-k="${key}">${escapeHtml(val||"")}</textarea>`;
  else if(tag==="textarea-lg") el = `<textarea data-k="${key}" style="min-height:180px">${escapeHtml(val||"")}</textarea>`;
  else el = `<input data-k="${key}" value="${escapeHtml(val||"")}">`;
  return `<div class="field"><label>${label}</label>${el}</div>`;
}
function fSelect(label,key,val,options){
  return `<div class="field"><label>${label}</label><select data-k="${key}">${options.map(o=>`<option ${o===val?"selected":""}>${escapeHtml(o)}</option>`).join("")}</select></div>`;
}

document.getElementById("saveBtn").onclick = ()=>{
  const kv = {};
  document.querySelectorAll("#editFields [data-k]").forEach(el=> kv[el.dataset.k] = el.value);
  const {type,idx} = editState;
  if(type==="announcement"){
    const rec = {date:kv.date,title:kv.title,body:kv.body};
    if(idx>=0) D.announcements[idx]=rec; else D.announcements.unshift(rec);
  } else if(type==="menu"){
    const rec = {cat:kv.cat,name:kv.name,en:kv.en,price:kv.price,desc:kv.desc};
    if(idx>=0) D.menu[idx]=rec; else D.menu.push(rec);
  } else if(type==="staff"){
    const rec = {name:kv.name,role:kv.role,initial:kv.initial||kv.name[0]||"?",bio:kv.bio,photo:(kv.photo||"").trim()};
    if(idx>=0) D.staff[idx]=rec; else D.staff.push(rec);
  } else if(type==="contact"){
    const lines = {};
    kv.lines.split(/\n/).forEach(line=>{
      const m = line.match(/^\s*([^:：]+)\s*[:：]\s*(.*)$/);
      if(m) lines[m[1].trim()] = m[2].trim();
    });
    const rec = {title:kv.title,lines};
    if(idx>=0) D.contact[idx]=rec; else D.contact.push(rec);
  } else if(type==="categories"){
    D.categories = kv.cats.split(/\n/).map(s=>s.trim()).filter(Boolean);
    if(!D.categories.includes(window._curCat) && window._curCat!=="全部") window._curCat="全部";
  }
  saveData(); render(); closeModal("editModal"); toast("已儲存");
};

document.getElementById("deleteBtn").onclick = ()=>{
  const {type,idx} = editState;
  if(idx<0) return;
  if(!confirm("確定刪除？")) return;
  if(type==="announcement") D.announcements.splice(idx,1);
  else if(type==="menu") D.menu.splice(idx,1);
  else if(type==="staff") D.staff.splice(idx,1);
  else if(type==="contact") D.contact.splice(idx,1);
  saveData(); render(); closeModal("editModal"); toast("已刪除");
};

/* ============ 登入 / 管理員 ============ */
document.getElementById("adminBtn").onclick = ()=>{

    // 已登入，開管理員面板
    document.getElementById("editHomeTitle").value = D.home.title;
    document.getElementById("editHomeDesc").value = D.home.desc;
    document.getElementById("newPwd").value = "";
    openModal("adminModal");
  } else {
    document.getElementById("pwdInput").value = "";
    openModal("loginModal");
    setTimeout(()=>document.getElementById("pwdInput").focus(),100);
  }
};

document.getElementById("loginBtn").onclick = async ()=>{
  const pwd = document.getElementById("pwdInput").value;
  const h = await sha256(pwd);
  if(h === D.pwdHash){
    document.body.classList.add("admin");
    document.getElementById("adminBtn").classList.add("on");
    document.getElementById("adminBtn").textContent = "🔓 管理中";
    closeModal("loginModal");
    render();
    toast("登入成功");
  } else {
    toast("密碼錯誤");
  }
};
document.getElementById("pwdInput").addEventListener("keydown",e=>{if(e.key==="Enter") document.getElementById("loginBtn").click();});

document.getElementById("adminSaveBtn").onclick = async ()=>{
  const newPwd = document.getElementById("newPwd").value;
  if(newPwd){
    D.pwdHash = await sha256(newPwd);
    toast("密碼已更新");
  }
  D.home.title = document.getElementById("editHomeTitle").value;
  D.home.desc = document.getElementById("editHomeDesc").value;
  saveData(); render();
  closeModal("adminModal");
};

document.getElementById("logoutBtn").onclick = ()=>{
  document.body.classList.remove("admin");
  const b = document.getElementById("adminBtn");
  b.classList.remove("on");
  b.textContent = "🔒 管理員";
  closeModal("adminModal");
  render();
  toast("已登出");
};

/* ============ 匯出 / 匯入 ============ */
document.getElementById("exportBtn").onclick = ()=>{
  const blob = new Blob([JSON.stringify(D,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `starfall-bakery-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast("已匯出");
};
document.getElementById("importBtn").onclick = ()=> document.getElementById("importFile").click();
document.getElementById("importFile").onchange = (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const obj = JSON.parse(r.result);
      if(!obj.menu || !obj.staff) throw new Error("格式錯誤");
      D = obj; saveData(); render(); closeModal("adminModal"); toast("匯入成功");
    }catch(err){ toast("匯入失敗：" + err.message); }
  };
  r.readAsText(f);
  e.target.value = "";
};

/* ============ Modal ============ */
function openModal(id){ document.getElementById(id).classList.add("on"); }
function closeModal(id){ document.getElementById(id).classList.remove("on"); }
document.querySelectorAll(".modal-mask").forEach(m=>{
  m.addEventListener("click",e=>{ if(e.target===m) m.classList.remove("on"); });
});

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(window._tt);
  window._tt = setTimeout(()=>t.classList.remove("on"),1800);
}

render();
</script>
